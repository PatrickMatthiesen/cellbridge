name: Build and protocol checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benchmark/**'
      - 'testdata/**'
      - 'Directory.*'
      - 'nuget.config'
      - 'global.json'
      - 'tools/CellBridge.Admin/**'
      - 'tools/CellBridge.Storage.*/**'
      - 'tools/CellBridge.Lists.Setup/**'
      - 'tools/verify_packages.py'
      - 'tools/package_manifest.py'
      - 'tools/check_release.py'
      - 'tools/publish_packages.py'
      - 'tools/OfficeInspectors.Dump/**'
      - 'examples/**'
      - 'docs/package-readme.md'
      - 'docs/lists-package-readme.md'
      - 'CellBridge.slnx'
      - '.github/workflows/capture-kit.yml'
      - '.github/workflows/publish-nuget.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benchmark/**'
      - 'testdata/**'
      - 'Directory.*'
      - 'nuget.config'
      - 'global.json'
      - 'tools/CellBridge.Admin/**'
      - 'tools/CellBridge.Storage.*/**'
      - 'tools/CellBridge.Lists.Setup/**'
      - 'tools/verify_packages.py'
      - 'tools/package_manifest.py'
      - 'tools/check_release.py'
      - 'tools/publish_packages.py'
      - 'tools/OfficeInspectors.Dump/**'
      - 'examples/**'
      - 'docs/package-readme.md'
      - 'docs/lists-package-readme.md'
      - 'CellBridge.slnx'
      - '.github/workflows/capture-kit.yml'
      - '.github/workflows/publish-nuget.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  protocol:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '11.0.100-rc.3.26522.148'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'Directory.*', 'nuget.config', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - run: dotnet test tests/CellBridge.FssHttp.Tests --nologo --verbosity minimal
      - run: dotnet test tests/CellBridge.FssHttpB.Tests --nologo --verbosity minimal
      - run: dotnet test tests/OfficeInspectors.Adapter --nologo --verbosity minimal
      - run: dotnet test tests/CellBridge.WebDemo.Tests --nologo --verbosity minimal
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/verify_packages.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cellbridge-beta-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/packages/manifest.json
          if-no-files-found: error
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cellbridge
          POSTGRES_USER: cellbridge
          POSTGRES_PASSWORD: cellbridge-tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cellbridge -d cellbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__cellbridge: Host=localhost;Port=5432;Database=cellbridge;Username=cellbridge;Password=cellbridge-tests
      CELLBRIDGE_LISTS_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=cellbridge;Username=cellbridge;Password=cellbridge-tests
      CELLBRIDGE_LISTS_REQUIRE_DATABASE: 'true'
      CELLBRIDGE_QUALIFICATION_DIRECTORY: ${{ github.workspace }}/artifacts/recovery
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '11.0.100-rc.3.26522.148'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'Directory.*', 'nuget.config', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - run: dotnet build tools/CellBridge.Storage.Setup --nologo
      - run: dotnet tools/CellBridge.Storage.Setup/bin/Debug/net11.0/CellBridge.Storage.Setup.dll
      - run: dotnet test CellBridge.slnx -m:1 --filter "FullyQualifiedName!~CellBridge.SqlServer.Tests" --nologo --verbosity minimal --logger trx --results-directory artifacts/test-results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: storage-evidence
          path: |
            artifacts/recovery/environment.json
            artifacts/test-results/*.trx
  sqlserver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '11.0.100-rc.3.26522.148'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'Directory.*', 'nuget.config', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - run: dotnet test tests/CellBridge.SqlServer.Tests -m:1 --nologo --verbosity minimal --logger trx --results-directory artifacts/sqlserver
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sqlserver-evidence
          path: artifacts/sqlserver/*.trx
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '11.0.100-rc.3.26522.148'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'Directory.*', 'nuget.config', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/verify_packages.py --sqlserver
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: package-consumer-evidence
          path: |
            artifacts/packages/verification.json
            artifacts/packages/test-results/*.trx
            artifacts/packages/document-library-tests/*.trx
            artifacts/packages/sqlserver-orchestration/*.trx
            artifacts/packages/sqlserver-tests/**/*.trx
