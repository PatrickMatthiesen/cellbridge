name: Capture and protocol checks
on:
  pull_request:
    paths:
      - 'tools/capture/**'
      - 'tools/testing/**'
      - 'src/**'
      - 'tests/**'
      - 'benchmark/**'
      - 'testdata/**'
      - 'Directory.*'
      - 'nuget.config'
      - 'global.json'
      - 'tools/CellBridge.Admin/**'
      - 'tools/CellBridge.Storage.*/**'
      - 'tools/CellBridge.Lists.Setup/**'
      - 'tools/verify_packages.py'
      - 'tools/package_manifest.py'
      - 'tools/check_release.py'
      - 'tools/publish_packages.py'
      - 'tools/OfficeInspectors.Dump/**'
      - 'examples/**'
      - 'docs/package-readme.md'
      - 'docs/lists-package-readme.md'
      - 'CellBridge.slnx'
      - '.github/workflows/capture-kit.yml'
      - '.github/workflows/publish-nuget.yml'
  push:
    branches: [main]
    paths:
      - 'tools/capture/**'
      - 'tools/testing/**'
      - 'src/**'
      - 'tests/**'
      - 'benchmark/**'
      - 'testdata/**'
      - 'Directory.*'
      - 'nuget.config'
      - 'global.json'
      - 'tools/CellBridge.Admin/**'
      - 'tools/CellBridge.Storage.*/**'
      - 'tools/CellBridge.Lists.Setup/**'
      - 'tools/verify_packages.py'
      - 'tools/package_manifest.py'
      - 'tools/check_release.py'
      - 'tools/publish_packages.py'
      - 'tools/OfficeInspectors.Dump/**'
      - 'examples/**'
      - 'docs/package-readme.md'
      - 'docs/lists-package-readme.md'
      - 'CellBridge.slnx'
      - '.github/workflows/capture-kit.yml'
      - '.github/workflows/publish-nuget.yml'
permissions:
  contents: read
jobs:
  protocol:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/CellBridge.FssHttp.Tests --nologo --verbosity minimal
      - run: dotnet test tests/CellBridge.FssHttpB.Tests --nologo --verbosity minimal
      - run: dotnet test tests/OfficeInspectors.Adapter --nologo --verbosity minimal
      - run: dotnet test tests/CellBridge.WebDemo.Tests --nologo --verbosity minimal
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/verify_packages.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cellbridge-beta-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/packages/manifest.json
          if-no-files-found: error
  storage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cellbridge
          POSTGRES_USER: cellbridge
          POSTGRES_PASSWORD: cellbridge-tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__cellbridge: Host=localhost;Port=5432;Database=cellbridge;Username=cellbridge;Password=cellbridge-tests
      CELLBRIDGE_LISTS_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=cellbridge;Username=cellbridge;Password=cellbridge-tests
      CELLBRIDGE_LISTS_REQUIRE_DATABASE: 'true'
      CELLBRIDGE_QUALIFICATION_DIRECTORY: ${{ github.workspace }}/artifacts/recovery
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build tools/CellBridge.Storage.Setup --nologo
      - run: dotnet tools/CellBridge.Storage.Setup/bin/Debug/net10.0/CellBridge.Storage.Setup.dll
      - run: dotnet test CellBridge.slnx -m:1 --nologo --verbosity minimal
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/verify_packages.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: storage-and-package-consumer-evidence
          path: |
            artifacts/recovery/environment.json
            artifacts/packages/test-results/*.trx
            artifacts/packages/document-library-tests/*.trx
  capture-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node tools/testing/test-list-example-ui.cjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'tools/capture/requirements*.txt'
      - run: python -m pip install --require-hashes -r tools/capture/requirements-dev.txt
      - run: python -m pytest tools/capture -q
  capture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node tools/testing/test-list-example-ui.cjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'tools/capture/requirements*.txt'
      - run: python -m pip install --require-hashes -r tools/capture/requirements-dev.txt
      - run: python -m pytest tools/capture -q
      - run: python -m pytest tools/testing -q
      - name: Parse the desktop Word scripts
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/testing/word-smoke.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors) { $errors | Format-List; exit 1 }
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/testing/office-repeat.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors) { $errors | Format-List; exit 1 }
      - name: Exercise the desktop Word wrapper failure paths
        shell: pwsh
        run: ./tools/testing/test-word-wrapper.ps1
      - name: Exercise Word startup and cleanup without desktop Office
        shell: pwsh
        run: ./tools/testing/test-word-startup.ps1
      - name: Exercise script logic without Office in Windows PowerShell
        shell: powershell
        run: |
          ./tools/testing/test-word-compatibility.ps1
          ./tools/testing/test-office-repeat-lifetime.ps1
      - name: Exercise script logic without Office in PowerShell Core
        shell: pwsh
        run: |
          ./tools/testing/test-word-compatibility.ps1
          ./tools/testing/test-office-repeat-lifetime.ps1
