name: Capture and protocol checks
on:
  pull_request:
    paths:
      - 'tools/capture/**'
      - 'aspire/apphost.cs'
      - 'src/**'
      - 'tests/**'
      - 'CellBridge.slnx'
      - '.github/workflows/capture-kit.yml'
  push:
    branches: [main]
    paths:
      - 'tools/capture/**'
      - 'aspire/apphost.cs'
      - 'src/**'
      - 'tests/**'
      - 'CellBridge.slnx'
      - '.github/workflows/capture-kit.yml'
permissions:
  contents: read
jobs:
  protocol:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test CellBridge.slnx --nologo --verbosity minimal
  capture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'tools/capture/requirements*.txt'
      - run: python -m pip install -r tools/capture/requirements-dev.txt
      - run: python -m pytest tools/capture -q
