name: Storage performance report
on:
  workflow_dispatch:
    inputs:
      sizes:
        description: DOCX sizes in MiB, comma separated
        default: '1,10'
        required: true
      clients:
        description: Concurrent clients, comma separated
        default: '1,8'
        required: true
      iterations:
        description: Saves per client
        default: '5'
        required: true
  schedule:
    - cron: '0 3 * * 1'
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        content: [postgresql, filesystem]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cellbridge_benchmark
          POSTGRES_USER: cellbridge
          POSTGRES_PASSWORD: benchmark-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__cellbridge: Host=localhost;Port=5432;Database=cellbridge_benchmark;Username=cellbridge;Password=benchmark-only
      BENCHMARK_SIZES: ${{ inputs.sizes || '1,10' }}
      BENCHMARK_CLIENTS: ${{ inputs.clients || '1,8' }}
      BENCHMARK_ITERATIONS: ${{ inputs.iterations || '5' }}
      BENCHMARK_CONTENT: ${{ matrix.content }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build tools/CellBridge.Storage.Setup -c Release --nologo
      - run: dotnet build tools/CellBridge.Storage.Benchmark -c Release --nologo
      - run: dotnet tools/CellBridge.Storage.Setup/bin/Release/net10.0/CellBridge.Storage.Setup.dll
      - name: Measure synthetic durable saves and verified downloads
        run: >-
          dotnet tools/CellBridge.Storage.Benchmark/bin/Release/net10.0/CellBridge.Storage.Benchmark.dll
          --content "$BENCHMARK_CONTENT" --root "$RUNNER_TEMP/cellbridge-content"
          --sizes "$BENCHMARK_SIZES" --clients "$BENCHMARK_CLIENTS" --iterations "$BENCHMARK_ITERATIONS"
          --output "artifacts/performance-$BENCHMARK_CONTENT.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-${{ matrix.content }}-${{ github.sha }}
          path: artifacts/performance-*.json
