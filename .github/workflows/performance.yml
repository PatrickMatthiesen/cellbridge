name: Performance checks
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
permissions:
  contents: read
jobs:
  benchmarkdotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '11.0.100-rc.3.26522.148'
      - run: dotnet tool install --global Aspire.Cli --version 17.0.0-preview.1.26520.1
      - name: Run all BenchmarkDotNet cases
        run: >-
          dotnet run -c Release --project benchmark/CellBridge.Benchmarks --
          --filter '*' --artifacts artifacts/benchmarks --exporters json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: benchmarkdotnet-${{ github.sha }}
          path: artifacts/benchmarks/
          retention-days: 14
  load-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        backend: [postgresql, sqlserver]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '11.0.100-rc.3.26522.148'
      - run: dotnet tool install --global Aspire.Cli --version 17.0.0-preview.1.26520.1
      - name: Run Lists HTTP load
        run: >-
          dotnet run -c Release --project benchmark/CellBridge.Benchmarks --
          --load-test --backend ${{ matrix.backend }}
          --config benchmark/CellBridge.Benchmarks/load.json --target lists-http
      - name: Run document HTTP load
        run: >-
          dotnet run -c Release --project benchmark/CellBridge.Benchmarks --
          --load-test --backend ${{ matrix.backend }}
          --config benchmark/CellBridge.Benchmarks/load.json --target document-http
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: load-tests-${{ matrix.backend }}-${{ github.sha }}
          path: artifacts/load-tests/
          retention-days: 14
