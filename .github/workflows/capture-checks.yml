name: Capture and tooling checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/capture/**'
      - 'tools/testing/**'
      - 'tools/verify_packages.py'
      - 'tools/package_manifest.py'
      - 'tools/check_release.py'
      - 'tools/publish_packages.py'
      - 'testdata/**'
      - '.github/workflows/capture-checks.yml'
  push:
    branches: [main]
    paths:
      - 'tools/capture/**'
      - 'tools/testing/**'
      - 'tools/verify_packages.py'
      - 'tools/package_manifest.py'
      - 'tools/check_release.py'
      - 'tools/publish_packages.py'
      - 'testdata/**'
      - '.github/workflows/capture-checks.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  capture-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'tools/capture/requirements*.txt'
      - run: python -m pip install --require-hashes -r tools/capture/requirements-dev.txt
      - run: python -m pytest tools/capture -q
  capture:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'tools/capture/requirements*.txt'
      - run: python -m pip install --require-hashes -r tools/capture/requirements-dev.txt
      - run: python -m pytest tools/capture -q
      - run: python -m pytest tools/testing -q
      - name: Parse the desktop Word scripts
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/testing/word-smoke.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors) { $errors | Format-List; exit 1 }
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/testing/office-repeat.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors) { $errors | Format-List; exit 1 }
      - name: Exercise the desktop Word wrapper failure paths
        shell: pwsh
        run: ./tools/testing/test-word-wrapper.ps1
      - name: Exercise Word startup and cleanup without desktop Office
        shell: pwsh
        run: ./tools/testing/test-word-startup.ps1
      - name: Exercise script logic without Office in Windows PowerShell
        shell: powershell
        run: |
          ./tools/testing/test-word-compatibility.ps1
          ./tools/testing/test-office-repeat-lifetime.ps1
      - name: Exercise script logic without Office in PowerShell Core
        shell: pwsh
        run: |
          ./tools/testing/test-word-compatibility.ps1
          ./tools/testing/test-office-repeat-lifetime.ps1
