name: Publish NuGet beta
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact beta version in Directory.Build.props'
        required: true
        default: '0.1.0-beta.5'
        type: string
      publish:
        description: 'Upload packages after validation and login; false tests without uploading'
        required: true
        default: false
        type: boolean
      artifact-run-id:
        description: 'Optional prior validated publishing run; reuse its exact artifacts without rebuilding'
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: nuget-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main' && inputs.artifact-run-id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cellbridge
          POSTGRES_USER: cellbridge
          POSTGRES_PASSWORD: cellbridge-tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cellbridge -d cellbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__cellbridge: Host=localhost;Port=5432;Database=cellbridge;Username=cellbridge;Password=cellbridge-tests
      CELLBRIDGE_LISTS_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=cellbridge;Username=cellbridge;Password=cellbridge-tests
      CELLBRIDGE_LISTS_REQUIRE_DATABASE: 'true'
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '11.0.100-rc.3.26522.148'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check the requested version
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          if os.environ['RELEASE_VERSION'] != ET.parse('Directory.Build.props').findtext('.//Version'):
              raise SystemExit('Release version must match the committed source.')
          PY
      - run: dotnet build tools/CellBridge.Storage.Setup -c Release --nologo
      - run: dotnet tools/CellBridge.Storage.Setup/bin/Release/net11.0/CellBridge.Storage.Setup.dll
      - run: dotnet test CellBridge.slnx -m:1 -c Release --nologo --verbosity minimal
      - run: python -m pip install --require-hashes -r tools/capture/requirements-dev.txt
      - run: python -m pytest tools/capture tools/testing -q
      - run: python tools/verify_packages.py
      - run: python tools/check_release.py --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-release-${{ github.sha }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/packages/manifest.json
          if-no-files-found: error
  publish:
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      ((inputs.artifact-run-id == '' && needs.validate.result == 'success') ||
       (inputs.artifact-run-id != '' && needs.validate.result == 'skipped'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ github.sha }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact-run-id }}
      NUGET_USER: ${{ vars.NUGET_USER }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '11.0.100-rc.3.26522.148'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify the retained artifact producer
        if: inputs.artifact-run-id != ''
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact-run-id }}
        run: python tools/verify_release_run.py --run-id "$ARTIFACT_RUN_ID"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-release-${{ steps.producer.outputs.source_sha || github.sha }}
          path: artifacts/packages
          run-id: ${{ inputs.artifact-run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Validate the exact artifacts before authentication
        run: |
          test -n "$NUGET_USER"
          if [ -n "$ARTIFACT_RUN_ID" ]; then
            SOURCE_SHA="${{ steps.producer.outputs.source_sha }}"
          fi
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          python tools/check_release.py --version "$RELEASE_VERSION" --commit "$SOURCE_SHA"
          if [ -n "$ARTIFACT_RUN_ID" ]; then
            python tools/publish_packages.py --version "$RELEASE_VERSION" --commit "$SOURCE_SHA" --preflight-resume
          fi
      - name: Obtain temporary NuGet credentials
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish dependency packages, then the host, then symbols
        if: inputs.publish
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          args=()
          if [ -n "$ARTIFACT_RUN_ID" ]; then args+=(--resume); fi
          python tools/publish_packages.py --version "$RELEASE_VERSION" --commit "$SOURCE_SHA" "${args[@]}"
