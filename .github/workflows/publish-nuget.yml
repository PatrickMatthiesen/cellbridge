name: Publish NuGet beta
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact beta version in Directory.Build.props'
        required: true
        default: '0.1.0-beta.1'
        type: string
      publish:
        description: 'Publish the validated packages to NuGet.org'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: nuget-release
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cellbridge
          POSTGRES_USER: cellbridge
          POSTGRES_PASSWORD: cellbridge-tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__cellbridge: Host=localhost;Port=5432;Database=cellbridge;Username=cellbridge;Password=cellbridge-tests
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the requested version
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          if os.environ['RELEASE_VERSION'] != ET.parse('Directory.Build.props').findtext('.//Version'):
              raise SystemExit('Release version must match the committed source.')
          PY
      - run: dotnet build tools/CellBridge.Storage.Setup -c Release --nologo
      - run: dotnet tools/CellBridge.Storage.Setup/bin/Release/net10.0/CellBridge.Storage.Setup.dll
      - run: dotnet test CellBridge.slnx -c Release --nologo --verbosity minimal
      - run: dotnet test demo/CellBridge.Demo.slnx -c Release --nologo --verbosity minimal
      - run: python -m pip install -r tools/capture/requirements-dev.txt
      - run: python -m pytest tools/capture tools/testing -q
      - run: python tools/verify_packages.py
      - run: python tools/check_release.py --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-release-${{ github.sha }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/packages/manifest.json
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main' && inputs.publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      NUGET_USER: ${{ vars.NUGET_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nuget-release-${{ github.sha }}
          path: artifacts/packages
      - name: Validate the exact artifacts before authentication
        run: |
          test -n "$NUGET_USER"
          python tools/check_release.py --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
      - name: Obtain temporary NuGet credentials
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish dependency packages, then the host, then symbols
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: python tools/publish_packages.py --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
